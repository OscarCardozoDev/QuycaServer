name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  jest:
    name: Jest — server unit tests
    runs-on: ubuntu-latest

    # Dos suites no son unitarias: `src/tenant/tenant-isolation.spec.ts` ejercita
    # la extensión real contra dos instituciones reales —es el criterio de
    # aceptación del aislamiento multi-tenant, y con mocks no probaría nada— y
    # `src/modules/products/Product.audio.spec.ts` escribe el audio en disco y
    # guarda la ruta. Sin base, ambas reventaban acá: 35 tests en rojo mientras
    # los otros 367 pasaban.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quyca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quyca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # `src/modules/auth/refresh-token.spec.ts` corre contra un Redis REAL, no
      # contra un mock: la rotación entera vive en un script Lua (`ROTATE_LUA`)
      # y ningún mock de Redis ejecuta Lua, así que con mocks el spec no
      # probaría la lógica sino la maqueta. Sin este servicio el spec falla
      # ruidosamente —lanza si `REDIS_AUTH_URL` no está— en vez de conectarse a
      # la nada y dar verde, que es lo que uno quiere de un test de seguridad.
      #
      # Sin `requirepass` a propósito: es un contenedor efímero del runner,
      # accesible solo desde localhost y sin datos que proteger. En dev y en
      # producción la instancia SÍ pide contraseña, y además lleva
      # `appendonly yes` y `maxmemory-policy noeviction`, que son condiciones de
      # la garantía de seguridad — ver
      # obsidian/Decisiones/Almacenamiento-de-Refresh-Tokens.md.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `env/development.env` está gitignoreado, así que en CI no existe: el
      # `dotenv.config()` de los specs y de prisma.config.ts no encuentra nada y
      # esta variable es la única fuente de la conexión. dotenv no pisa lo que
      # ya está en el entorno, así que tampoco molesta si algún día existiera.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quyca_test
      # El spec le agrega `/1` para aislarse en otra base lógica y hace
      # `flushdb` —nunca `flushall`— entre casos.
      REDIS_AUTH_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Antes de levantar la base: si no compila, el resto del job es tiempo
      # perdido. Sin este paso, un error de tipos pasa el CI en verde y aparece
      # recién en la VM, durante el `up --build`, con el sitio abajo.
      - name: Compilar
        run: bun run build

      # El binario local, no `npx`: ya está instalado y no hay que ir al
      # registry. `prisma.config.ts` toma la URL de DATABASE_URL.
      - name: Migrar la base de test
        run: ./node_modules/.bin/prisma migrate deploy

      # Las dos suites de integración necesitan los catálogos sembrados: el plan
      # 'academia' y una GroupCategory (aislamiento), y el grupo de plataforma
      # "Música" (audio). El seed es idempotente.
      - name: Sembrar datos estáticos
        run: bun run prisma:seed:static

      - run: bun run test

  # La imagen de producción es lo único que la VM ejecuta, y era lo único que el
  # CI nunca ejercitaba. El 2026-08-26 tres errores aparecieron recién en el
  # primer `podman-compose up --build` de la VM; dos de los tres los agarra este
  # job solo. Construye, no publica: no hay registry todavía.
  image:
    name: Docker — imagen de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f Dockerfile.prod .

  # Despliegue. Solo en master, y solo si los tests Y la imagen de producción
  # pasaron: `needs` es lo que le da sentido al job `image` de arriba —sin esto,
  # el CI avisaría del build roto DESPUÉS de haberlo publicado.
  deploy:
    name: Deploy — VM de producción
    needs: [jest, image]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # Dos pushes seguidos a master no pueden construir a la vez en la misma VM.
    # `cancel-in-progress: false`: un deploy a medias se termina, no se aborta.
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false

    steps:
      # Historia de por que este script es asi. Los cuatro defectos aparecieron
      # en los tres primeros deploys reales (2026-08-30):
      #
      # 1. `script_stops: true` NO es un input valido de ssh-action@v1 —GitHub lo
      #    ignoro con un warning—. El `git pull` fallo, el script siguio de largo
      #    y el job se puso VERDE con la imagen construida del codigo viejo.
      #    `set -eu` es lo que si corta.
      #
      # 2. `git pull` abortaba: el clon de la VM tenia el arbol sucio. Un
      #    servidor de despliegue NO es un workspace: `fetch` + `reset --hard`
      #    lo dejan identico al remoto. Lo editado a mano alla se pierde, que es
      #    lo que se quiere: si un cambio importa, va commiteado.
      #
      # 3. `up -d --build --force-recreate <svc>` NO recrea el contenedor en
      #    podman-compose 1.0.6: lo REINICIA. Quedaba corriendo la imagen con la
      #    que fue creado dias atras mientras el tag `latest` ya apuntaba a otra.
      #    Sintoma: build exitoso, deploy verde, y la ruta nueva devolviendo 404.
      #    El unico camino confiable es `podman rm -f` y volver a crearlo.
      #
      # 4. `podman rm -f backend` falla con 125: el `depends_on` del compose se
      #    traduce a `--requires`, y **frontend depende de backend**. Hay que
      #    usar `--depend`, que se lleva el frontend por delante. Consecuencia
      #    aceptada: no existe desplegar SOLO el backend —el SPA cae con el—.
      #    Por eso el `up` levanta los dos.
      #
      # El `build` va ANTES del `rm`: construir con el contenedor ya borrado
      # deja el sitio caido los ~2 min que tarda, en vez de ~20 s.
      #
      # `--no-deps` declara que este job no administra la base. NO es lo que
      # protege los secretos: se creyo que si, y era falso —la contrasena
      # siguio apareciendo en los dos runs siguientes—. `--no-deps` reduce lo
      # que podman-compose HACE, no lo que IMPRIME.
      #
      # La fuga se arreglo en el compose: `db` paso de `environment:` a
      # `env_file:`. podman-compose expande cada clave de `environment:` a un
      # `-e VAR=valor` visible en el log; un `env_file` va como `--env-file`,
      # sin expandir. Es por eso que el JWT_SECRET del backend nunca se filtro
      # estando en el mismo despliegue.
      #
      # El compose se trae del repo `Quyca` en el primer paso: /Quyca es un clon
      # con sparse-checkout de un solo archivo, para no dejar el vault entero en
      # un servidor de produccion. Antes el compose de la VM y el del repo eran
      # archivos distintos y nadie revisaba el que mandaba.
      #
      # Recrear el backend le cambia la IP en la red de podman, y el nginx del
      # frontend la tenia resuelta de su arranque: el resultado es 502 hasta que
      # alguien lo recarga. Recrear el frontend en el mismo paso lo resuelve sin
      # un `nginx -s reload` aparte.
      - name: Actualizar y reconstruir el backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # El default de la accion son 10 minutos. El build del backend tarda
          # ~2, pero el del frontend no entro y murio con "Run Command Timeout"
          # el 2026-08-30. Se sube aca tambien por margen: la VM es chica y el
          # build compite por RAM con la app viva.
          command_timeout: 30m
          script: |
            set -eu
            git -C /Quyca fetch --depth 1 origin master
            git -C /Quyca reset --hard origin/master
            git -C /Quyca/QuycaServer fetch origin master
            git -C /Quyca/QuycaServer reset --hard FETCH_HEAD
            cd /Quyca
            sudo podman-compose -f docker-compose.prod.yml build backend
            sudo podman rm -f --depend backend
            sudo podman-compose -f docker-compose.prod.yml up -d --no-deps backend frontend

      # El job no está verde porque el comando no falló: está verde porque el
      # sitio responde. Se prueba desde afuera, por HTTPS, que es como lo ve el
      # usuario. Los reintentos cubren el arranque del contenedor y la carrera
      # con Postgres que `restart: unless-stopped` resuelve reiniciando.
      # /api/health, no /api-docs: Swagger dejo de montarse en produccion (es el
      # esquema OpenAPI completo servido a cualquiera). La sonda toca la base
      # con SELECT 1, asi que un 200 aca significa que el backend Y Postgres
      # responden, no solo que el proceso arranco.
      - name: Verificar que la API responde
        run: >-
          curl -fsS --retry 10 --retry-delay 10 --retry-all-errors
          -o /dev/null https://quyca.art/api/health
